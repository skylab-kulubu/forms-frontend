name: GHCR

on:
  push:
    branches: [main, production]
    tags: ["v*.*.*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: tags
        run: |
          img=ghcr.io/skylab-kulubu/forms-frontend
          sha='${{ github.sha }}'
          ref='${{ github.ref_name }}'
          if [ "$ref" = production ]; then
            echo "list=${img}:production,${img}:${sha}" >> "$GITHUB_OUTPUT"
          elif [ "$ref" = main ]; then
            echo "list=${img}:latest,${img}:${sha}" >> "$GITHUB_OUTPUT"
          else
            echo "list=${img}:${sha}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.list }}
      - name: Notify Dokploy
        if: github.ref == 'refs/heads/production'
        continue-on-error: true
        env:
          HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "DOKPLOY_DEPLOY_HOOK unset; skip"
            exit 0
          fi
          code=$(curl -sS -o /tmp/hook.out -w '%{http_code}' -A 'DokployDeployHook/1.0' -X POST "$HOOK")
          echo "hook HTTP $code"
          test "$code" -ge 200 && test "$code" -lt 300
